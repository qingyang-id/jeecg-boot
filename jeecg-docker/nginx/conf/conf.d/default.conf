# websocket client请求头自带http_upgrade,映射成connection_upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80; #监听端口
    server_name localhost; #监听地址
    
    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
