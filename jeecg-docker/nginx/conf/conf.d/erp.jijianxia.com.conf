# websocket client请求头自带http_upgrade,映射成connection_upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80; #监听HTTP端口
    server_name erp.jijianxia.com; #监听地址
    # Let's Encrypt HTTP-01 验证（acme.sh webroot = /home/www/web/erp）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/web;
    }
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2; #监听HTTPS端口（http2：新前端首屏约 450 个文件，HTTP/1.1 下排队严重）
    server_name erp.jijianxia.com; #监听地址
    ssl_certificate /etc/nginx/cert/erp.jijianxia.com_bundle.pem;
    ssl_certificate_key /etc/nginx/cert/erp.jijianxia.com.key;
    ssl_session_timeout 60m;
    ssl_session_cache shared:SSL:10m;

    # websocket请求
    location ^~ /portal/websocket {
        proxy_pass http://erp-api:8080/portal/websocket/;
        proxy_http_version 1.1;
        # 超时设置1分钟
        proxy_read_timeout   3600s;
        # 启用支持websocket连接，nginx的功能
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /portal {
        proxy_pass              http://erp-api:8080/portal/;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /electron {
        alias   /var/www/electron;
        index  index.html index.htm;
    }

    # Vite 产物文件名带内容哈希，可长期缓存
    location ^~ /js/ {
        root   /var/www/web/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /assets/ {
        root   /var/www/web/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # 入口页不缓存，发版后立即生效
    location = /index.html {
        root   /var/www/web/;
        add_header Cache-Control "no-cache";
    }

    #解决Router(mode: 'history')模式下，刷新路由地址不能找到页面的问题
    location / {
        root   /var/www/web/;
        index  index.html index.htm;
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.html?s=$1 last;
            break;
        }
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}
